---
# Install with: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-xml
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: fix-byte-order-marker
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-no-secrets
        name: Refuse staged content that looks like a token
        entry: python3 ./scripts/pre-commit/check_no_secrets.py
        language: system
        pass_filenames: true
        stages: [pre-commit]
