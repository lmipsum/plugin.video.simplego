name: release

# Run by hand on main once dev is merged (a pull request: main takes no push, see the main ruleset)
# with addon.xml's new version and its news, both raised on dev (scripts/update_news.py)
# (Actions → release → Run workflow, or `gh workflow run release.yml --ref main`).
# It tags main's commit vX.Y.Z and publishes the installable zip, its notes the version's news.
# With submit_to_kodi (on unless unticked) it also opens the pull request to Kodi's official repository,
# where users install and update the add-on from (see kodi-submit.yml). That repository wants few
# updates (https://kodi.wiki/view/Add-on_rules#Updates): untick it for a version not worth one.
on:
  workflow_dispatch:
    inputs:
      submit_to_kodi:
        description: "Also submit this version to Kodi's official repository"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release

jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      # A step's output: a job's outputs are not promised what later steps' env has.
      tag: v${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the tags, to refuse a version released already
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Version not released yet
        id: version
        run: |
          version=$(python scripts/build_zip.py version)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is released already: raise the version in addon.xml first"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: News
        # Written on dev with the version raised: none for this version, nothing is released.
        run: python scripts/update_news.py notes > notes.md
      - name: Build
        # Before the tag: a failed build leaves nothing released, so the run can be repeated.
        run: python scripts/build_zip.py
      - name: Tag
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/*.zip --title "v$VERSION" --notes-file notes.md

  kodi:
    needs: release
    if: inputs.submit_to_kodi
    uses: ./.github/workflows/kodi-submit.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
