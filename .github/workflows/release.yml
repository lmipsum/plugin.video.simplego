name: release

# Run by hand on main once dev is merged and addon.xml has the new version
# (Actions → release → Run workflow, or `gh workflow run release.yml --ref main`).
# It writes the news from the feat:/fix: commits (see scripts/update_news.py), commits it,
# tags that commit vX.Y.Z, publishes the installable zip and adds it to the Kodi repository
# (the gh-pages branch, see scripts/build_repo.py). Merge main back into dev afterwards.
# With submit_to_kodi it also opens the pull request to Kodi's official repository (see kodi-submit.yml):
# for stable versions only, as that repository wants few updates (https://kodi.wiki/view/Add-on_rules#Updates).
on:
  workflow_dispatch:
    inputs:
      submit_to_kodi:
        description: "Also submit this version to Kodi's official repository"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release

jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      # A step's output: a job's outputs are not promised what later steps' env has.
      tag: v${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the commits since the last tag make the news
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Version not released yet
        id: version
        run: |
          version=$(python scripts/build_repo.py version)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is released already: raise the version in addon.xml first"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: News
        run: python scripts/update_news.py > notes.md
      - name: Build
        # Before the tag: a failed build leaves nothing released, so the run can be repeated.
        run: |
          python scripts/build_zip.py
          python scripts/build_repo.py zip repository.lmipsum
      - name: Commit the news and tag it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update the add-on news"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/*.zip --title "v$VERSION" --notes-file notes.md
      - name: Publish to the Kodi repository
        # The gh-pages branch, served by GitHub Pages once the repository is public (see repository.lmipsum).
        run: |
          if git fetch -q origin gh-pages; then
            git worktree add pages FETCH_HEAD && git -C pages switch -c gh-pages
          else
            git worktree add --orphan -b gh-pages pages
          fi
          python scripts/build_repo.py publish pages dist/*.zip
          git -C pages add -A
          git -C pages commit -m "Publish the Kodi repository"
          git -C pages push origin gh-pages

  kodi:
    needs: release
    if: inputs.submit_to_kodi
    uses: ./.github/workflows/kodi-submit.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
