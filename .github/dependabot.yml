version: 2

# Weekly grouped PRs against dev; a bump reaches main only through the normal merge.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Pinned to what Kodi 21's repository ships (see requirements-dev.txt and clientfactory.DISTRUSTED).
      - dependency-name: "certifi"
